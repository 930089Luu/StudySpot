<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Inicia sesión en StudySpot para ver la ocupación de las bibliotecas.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <title>Iniciar sesión · StudySpot</title>
  <link rel="icon" href="img/studyspot-simbolo-color.png" type="image/png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script type="module" src="js/login.js"></script>
</head>
<body class="page">
  <!-- Wireframe 1A: inicio de sesión -->
  <main class="auth">
    <header class="auth__header">
      <img class="auth__logo" src="img/studyspot-simbolo-color.png" alt="" width="88" height="88">
      <h1 class="auth__title">Study<span class="auth__title-accent">Spot</span></h1>
      <p class="auth__subtitle">Mira lo llenas que están las bibliotecas antes de salir de casa.</p>
    </header>

    <p class="alert alert--success" id="aviso-login" role="status" hidden></p>

    <form class="form" id="form-login" novalidate>
      <div class="field">
        <label class="field__label" for="email">Correo institucional</label>
        <input class="field__input" id="email" name="email" type="email"
               autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false"
               placeholder="nombre@unizar.es" maxlength="254" required
               aria-describedby="email-error">
        <p class="field__error" id="email-error"></p>
      </div>

      <div class="field">
        <label class="field__label" for="password">Contraseña</label>
        <input class="field__input" id="password" name="password" type="password"
               autocomplete="current-password" required
               aria-describedby="password-error">
        <p class="field__error" id="password-error"></p>
      </div>

      <p class="alert alert--error" id="form-login-alerta" role="alert" hidden></p>

      <button class="button button--primary form__submit" type="submit">Iniciar sesión</button>
      <p class="form__extra"><a class="link" href="recuperar.html">¿Has olvidado tu contraseña?</a></p>
    </form>
  </main>

  <footer class="page__footer">
    <p>¿No tienes cuenta? <a class="link" href="registro.html">Crear cuenta</a></p>
  </footer>
</body>
</html>
