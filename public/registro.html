<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Crea tu cuenta de StudySpot con el correo de tu universidad.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Crear cuenta · StudySpot</title>
  <link rel="icon" href="img/studyspot-simbolo-color.png" type="image/png">
  <script src="js/tema-inicial.js"></script>
  <script src="js/i18n.js" defer></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/ios.css">
  <script type="module" src="js/registro.js"></script>
</head>
<body class="page ios">
  <!-- Wireframe 1B: registro -->
  <main class="auth auth--start">
    <nav aria-label="Navegación">
      <a class="back-link" href="index.html">
        <svg class="back-link__icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Iniciar sesión</span>
      </a>
    </nav>

    <header class="auth__header auth__header--start">
      <h1 class="auth__title auth__title--small">Crear cuenta</h1>
      <p class="auth__subtitle">Usa el correo de tu universidad para unirte a StudySpot.</p>
    </header>

    <!-- Las longitudes de los campos coinciden con src/constantes.php (el servidor vuelve a validarlas) -->
    <form class="form" id="form-registro" novalidate>
      <div class="ios-group">
        <div class="field">
          <label class="field__label" for="nombre">Nombre</label>
          <input class="field__input" id="nombre" name="nombre" type="text"
                 autocomplete="name" placeholder="Nombre y apellido" autocapitalize="words" maxlength="100" required
                 aria-describedby="nombre-error">
          <p class="field__error" id="nombre-error"></p>
        </div>

        <div class="field">
          <label class="field__label" for="email">Correo</label>
          <input class="field__input" id="email" name="email" type="email"
                 autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false"
                 placeholder="nombre@universidad.es" maxlength="254" required
                 aria-describedby="email-error">
          <p class="field__error" id="email-error"></p>
        </div>

        <div class="field">
          <label class="field__label" for="password">Contraseña</label>
          <input class="field__input" id="password" name="password" type="password"
                 autocomplete="new-password" placeholder="Mínimo 8 caracteres" minlength="8" maxlength="72" required
                 aria-describedby="password-ayuda password-error">
          <p class="field__hint" id="password-ayuda">Mínimo 8 caracteres.</p>
          <p class="field__error" id="password-error"></p>
        </div>

        <div class="field">
          <label class="field__label" for="password-repetida">Repetir</label>
          <input class="field__input" id="password-repetida" name="password_repetida" type="password"
                 autocomplete="new-password" placeholder="Otra vez la contraseña" maxlength="72" required
                 aria-describedby="password-repetida-error">
          <p class="field__error" id="password-repetida-error"></p>
        </div>
      </div>

      <p class="alert alert--error" id="form-registro-alerta" role="alert" hidden></p>

      <button class="button button--primary form__submit" type="submit">Crear cuenta</button>
    </form>
  </main>

  <footer class="page__footer">
    <p>¿Ya tienes cuenta? <a class="link" href="index.html">Iniciar sesión</a></p>
  </footer>
</body>
</html>
