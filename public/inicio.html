<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <title>Mapa · StudySpot</title>
  <link rel="icon" href="img/studyspot-simbolo-color.png" type="image/png">
  <!-- Se abre ya la conexión con Mapbox; su CSS y su JS (1,5 MB) los carga mapa.js sin bloquear la lista -->
  <link rel="preconnect" href="https://api.mapbox.com" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <!-- Los módulos que importa mapa.js se piden a la vez, no uno detrás de otro (K07) -->
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/formulario.js">
  <link rel="modulepreload" href="js/ocupacion.js">
  <link rel="modulepreload" href="js/rutas.js">
  <link rel="modulepreload" href="js/panel.js">
  <link rel="modulepreload" href="js/lista-bibliotecas.js">
  <script type="module" src="js/mapa.js"></script>
</head>
<body>
  <!--
    Wireframe 2A (US03): pantalla principal tras el login. Mapa con el % de ocupación de cada
    biblioteca, lista de bibliotecas abajo y barra de navegación Mapa · Check-in · Perfil.
  -->
  <main class="map-screen">
    <h1 class="visually-hidden">Mapa de bibliotecas</h1>
    <div class="map-screen__stage" id="mapa-escenario">
      <div class="map-screen__map" id="mapa" role="region" aria-label="Mapa de bibliotecas"></div>
      <!-- Mientras Mapbox prepara el mapa 3D: libros que se apilan y, encima, el globo de ocupación -->
      <div class="map-loader" id="mapa-cargando" role="status">
        <svg class="map-loader__dibujo" viewBox="0 0 120 100" aria-hidden="true" focusable="false">
          <g class="map-loader__libro map-loader__libro--1">
            <rect class="map-loader__tapa" x="24" y="76" width="72" height="12" rx="2"/>
            <rect class="map-loader__hojas" x="86" y="79" width="7" height="6" rx="1"/>
          </g>
          <g class="map-loader__libro map-loader__libro--2">
            <rect class="map-loader__tapa" x="30" y="64" width="62" height="12" rx="2"/>
            <rect class="map-loader__hojas" x="82" y="67" width="7" height="6" rx="1"/>
          </g>
          <g class="map-loader__libro map-loader__libro--3">
            <rect class="map-loader__tapa" x="27" y="52" width="60" height="12" rx="2"/>
            <rect class="map-loader__hojas" x="77" y="55" width="7" height="6" rx="1"/>
          </g>
          <g class="map-loader__libro map-loader__libro--4">
            <rect class="map-loader__tapa" x="35" y="40" width="50" height="12" rx="2"/>
            <rect class="map-loader__hojas" x="75" y="43" width="7" height="6" rx="1"/>
          </g>
          <path class="map-loader__globo" d="M60 37c-6-7-9-10-9-15a9 9 0 0 1 18 0c0 5-3 8-9 15z"/>
          <circle class="map-loader__globo-centro" cx="60" cy="22" r="3.5"/>
        </svg>
        <p class="map-loader__texto">Cargando mapa…</p>
      </div>
    </div>

    <section class="sheet" id="panel-bibliotecas" aria-labelledby="titulo-bibliotecas">
      <button class="sheet__toggle" id="panel-boton" type="button"
              aria-expanded="false" aria-controls="panel-bibliotecas">
        <span class="sheet__handle" aria-hidden="true"></span>
        <span class="visually-hidden" id="panel-boton-texto">Mostrar todas las bibliotecas</span>
      </button>
      <header class="sheet__header">
        <h2 class="sheet__title" id="titulo-bibliotecas">Bibliotecas</h2>
        <p class="sheet__meta" id="bibliotecas-actualizado" role="status"></p>
      </header>
      <p class="sheet__hint" id="aviso-favorita" hidden>
        Marca una biblioteca como favorita y el mapa se abrirá en ella.
      </p>
      <form class="sheet__search" role="search" action="#">
        <label class="visually-hidden" for="buscar-biblioteca">Buscar biblioteca por nombre o zona</label>
        <input class="field__input sheet__search-input" id="buscar-biblioteca" type="search"
               placeholder="Buscar biblioteca o zona" autocomplete="off" enterkeyhint="search"
               aria-controls="lista-bibliotecas">
      </form>
      <p class="state__text" id="bibliotecas-cargando">Cargando…</p>
      <p class="alert alert--error" id="mapa-alerta" role="alert" hidden></p>
      <p class="state__text" id="busqueda-vacia" role="status" hidden></p>
      <ul class="library-list" id="lista-bibliotecas"></ul>

      <!-- Tarjeta de la biblioteca tocada en el mapa o en la lista (sustituye a la lista) -->
      <article class="library-card" id="tarjeta-biblioteca" aria-labelledby="tarjeta-nombre" hidden>
        <header class="library-card__header">
          <h3 class="library-card__name">
            <!-- Tocar el nombre lleva al detalle de la biblioteca -->
            <a class="library-card__link" id="tarjeta-detalle" href="biblioteca.html">
              <span id="tarjeta-nombre"></span>
              <svg class="library-card__chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2"
                      stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </h3>
          <button class="library-card__close" id="tarjeta-cerrar" type="button" aria-label="Volver a la lista">
            <svg class="library-card__close-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round"/>
            </svg>
          </button>
        </header>
        <p class="library-card__address" id="tarjeta-direccion"></p>
        <div class="library-card__occupancy">
          <span class="library-card__value" id="tarjeta-valor"></span>
          <span class="library-card__status" id="tarjeta-estado"></span>
          <div class="library-card__meter" id="tarjeta-barra"></div>
        </div>
      </article>
    </section>

    <nav class="tab-bar" aria-label="Navegación principal">
      <a class="tab-bar__link" href="inicio.html" aria-current="page">
        <svg class="tab-bar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zm0 0v14m6-12v14" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linejoin="round"/>
        </svg>
        Mapa
      </a>
      <a class="tab-bar__link" href="checkin.html">
        <svg class="tab-bar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h2v2h-2zm4 0h2v2h-2zm-4 4h2v2h-2zm4 0h2v2h-2z"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        Check-in
      </a>
      <a class="tab-bar__link" href="perfil.html">
        <svg class="tab-bar__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 8a7 7 0 0 1 14 0" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round"/>
        </svg>
        Perfil
      </a>
    </nav>
  </main>
</body>
</html>
