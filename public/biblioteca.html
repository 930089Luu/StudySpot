<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <title>Biblioteca · StudySpot</title>
  <link rel="icon" href="img/studyspot-simbolo-color.png" type="image/png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script type="module" src="js/biblioteca.js"></script>
</head>
<body class="page">
  <!--
    Wireframe 3: detalle de una biblioteca. Ocupación actual con su fiabilidad (US03)
    y ocupación típica por día y hora con la ley de Little (US05).
  -->
  <main class="auth auth--start">
    <nav aria-label="Navegación">
      <a class="back-link" href="inicio.html" aria-label="Volver al mapa">
        <svg class="back-link__icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </nav>

    <p class="state__text" id="biblioteca-cargando" role="status">Cargando…</p>
    <p class="alert alert--error" id="biblioteca-alerta" role="alert" hidden></p>

    <article class="section" id="biblioteca" aria-labelledby="biblioteca-nombre" hidden>
      <img class="library__photo" id="biblioteca-foto" alt="" hidden>
      <header>
        <h1 class="library__name" id="biblioteca-nombre"></h1>
        <p class="library__detail" id="biblioteca-direccion"></p>
        <p class="library__detail" id="biblioteca-horario"></p>
      </header>

      <section class="occupancy-card" id="ocupacion-tarjeta" aria-label="Ocupación actual">
        <p class="occupancy-card__label">Ocupación actual</p>
        <p class="occupancy-card__value" id="ocupacion-valor"></p>
        <p class="occupancy-card__level" id="ocupacion-nivel"></p>
        <span class="meter" id="ocupacion-barra"></span>
        <p class="occupancy-card__meta" id="ocupacion-actualizado" role="status"></p>
      </section>

      <div>
        <p class="reliability" id="fiabilidad">
          <span>Fiabilidad de los datos:</span>
          <span class="reliability__bars" aria-hidden="true">
            <span class="reliability__bar"></span><span class="reliability__bar"></span><span class="reliability__bar"></span>
          </span>
          <span class="reliability__text" id="fiabilidad-texto"></span>
        </p>
        <p class="state__text" id="fiabilidad-detalle"></p>
      </div>

      <section class="section" aria-labelledby="titulo-franjas">
        <h2 class="section__title" id="titulo-franjas">Ocupación típica</h2>
        <div class="day-picker" role="group" aria-label="Día de la semana">
          <button class="day-picker__button" type="button" data-dia="1" aria-label="Lunes">L</button>
          <button class="day-picker__button" type="button" data-dia="2" aria-label="Martes">M</button>
          <button class="day-picker__button" type="button" data-dia="3" aria-label="Miércoles">X</button>
          <button class="day-picker__button" type="button" data-dia="4" aria-label="Jueves">J</button>
          <button class="day-picker__button" type="button" data-dia="5" aria-label="Viernes">V</button>
          <button class="day-picker__button" type="button" data-dia="6" aria-label="Sábado">S</button>
          <button class="day-picker__button" type="button" data-dia="7" aria-label="Domingo">D</button>
        </div>
        <p class="alert alert--error" id="franjas-alerta" role="alert" hidden></p>
        <p class="state__text" id="franjas-vacias" hidden>Aún no hay datos suficientes para este día.</p>
        <div id="franjas-contenido">
          <ul class="chart" id="grafico-franjas"></ul>
          <p class="chart__axis" aria-hidden="true">
            <span id="eje-inicio"></span><span id="eje-fin"></span>
          </p>
        </div>
        <p class="chart__legend" id="franjas-resumen"></p>
        <p class="state__text">Media de las semanas anteriores, calculada con la ley de Little (llegadas por hora × duración media de las sesiones).</p>
      </section>
    </article>
  </main>
</body>
</html>
