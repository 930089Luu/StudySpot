<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Perfil · StudySpot</title>
  <link rel="icon" href="img/studyspot-simbolo-color.png" type="image/png">
  <script src="js/tema-inicial.js"></script>
  <script src="js/i18n.js" defer></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/ios.css">
  <script type="module" src="js/perfil.js"></script>
</head>
<body class="page ios">
  <!--
    Perfil (wireframe 6, US04): tu ficha, tus puntos, amigos y grupos, y la fila de Ajustes.
    Estilo iOS (26-11). Los id son los de siempre: los rellena perfil.js.
  -->
  <main class="ios-screen">
    <nav class="ios-nav" aria-label="Navegación">
      <a class="back-link" href="inicio.html">
        <svg class="back-link__icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Mapa</span>
      </a>
      <span></span>
      <span></span>
    </nav>

    <p class="ios-section__footer" id="perfil-cargando" role="status">Cargando…</p>
    <p class="alert alert--error" id="perfil-alerta" role="alert" hidden></p>

    <section class="ios-screen__panel" id="perfil" aria-labelledby="perfil-nombre" hidden>
      <header class="ios-contact">
        <!-- Tocar el avatar abre el editor (como un Memoji) -->
        <a class="ios-contact__avatar" id="perfil-iniciales" href="avatar.html" aria-label="Editar avatar"></a>
        <a class="ios-contact__editar" id="perfil-editar-avatar" href="avatar.html">Crear avatar</a>
        <h1 class="ios-contact__name" id="perfil-nombre"></h1>
        <p class="ios-contact__subtitle" id="perfil-email"></p>
      </header>

      <div class="ios-section">
        <div class="ios-list">
          <div class="ios-row">
            <span class="ios-row__label">Puntos totales</span>
            <span class="ios-row__body"></span>
            <span class="ios-row__value" id="perfil-puntos"></span>
          </div>
        </div>
        <p class="ios-section__footer">Ganas puntos al terminar cada sesión de estudio: 1 punto cada 15 minutos.</p>
      </div>

      <div class="ios-list">
        <a class="ios-row" href="social.html">
          <span class="ios-row__body"><span class="ios-row__title">Amigos y grupos</span></span>
          <svg class="ios-row__chevron" viewBox="0 0 8.5 14" aria-hidden="true">
            <path d="M1.5 1.5 7 7l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
        <a class="ios-row" href="ajustes.html">
          <span class="ios-row__body"><span class="ios-row__title">Ajustes</span></span>
          <svg class="ios-row__chevron" viewBox="0 0 8.5 14" aria-hidden="true">
            <path d="M1.5 1.5 7 7l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>

      <div class="ios-section">
        <div class="ios-list">
          <button class="ios-row ios-row--action ios-row--destructive" id="boton-cerrar-sesion" type="button">Cerrar sesión</button>
        </div>
        <p class="alert alert--error" id="cerrar-sesion-alerta" role="alert" hidden></p>
      </div>
    </section>
  </main>
</body>
</html>
