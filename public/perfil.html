<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <title>Perfil · StudySpot</title>
  <link rel="icon" href="img/studyspot-simbolo-color.png" type="image/png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <script type="module" src="js/perfil.js"></script>
</head>
<body class="page">
  <!--
    Wireframe 6 (perfil): cabecera, puntos totales y acceso a amigos (US06).
    El objetivo semanal y el ranking son de US07 (Sprint 3).
  -->
  <main class="auth auth--start">
    <nav aria-label="Navegación">
      <a class="back-link" href="inicio.html" aria-label="Volver al inicio">
        <svg class="back-link__icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </nav>

    <p class="state__text" id="perfil-cargando" role="status">Cargando…</p>
    <p class="alert alert--error" id="perfil-alerta" role="alert" hidden></p>

    <section class="profile" id="perfil" aria-labelledby="perfil-nombre" hidden>
      <header class="profile__header">
        <span class="avatar" id="perfil-iniciales" aria-hidden="true"></span>
        <div>
          <h1 class="profile__name" id="perfil-nombre"></h1>
          <p class="profile__email" id="perfil-email"></p>
        </div>
      </header>

      <div class="points-card">
        <p class="points-card__value" id="perfil-puntos"></p>
        <p class="points-card__label">Puntos totales</p>
      </div>

      <p class="state__text">Ganas puntos al terminar cada sesión de estudio.</p>

      <a class="button button--secondary" href="social.html">Amigos y grupos</a>

      <p class="alert alert--error" id="cerrar-sesion-alerta" role="alert" hidden></p>
      <button class="button button--secondary" id="boton-cerrar-sesion" type="button">Cerrar sesión</button>
    </section>
  </main>
</body>
</html>
