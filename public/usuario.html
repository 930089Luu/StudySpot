<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Perfil · StudySpot</title>
  <link rel="icon" href="img/studyspot-simbolo-color.png" type="image/png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/ios.css">
  <script type="module" src="js/usuario.js"></script>
</head>
<body class="page ios">
  <!--
    Perfil de otra persona (mejora de US06): se abre al tocar un amigo o una solicitud recibida.
    Solo nombre y puntos; el correo y dónde estudia no se muestran aquí. Desde aquí se bloquea.
    Estilo de la ficha de Contactos de iOS: avatar grande centrado, nombre y listas agrupadas.
  -->
  <main class="ios-screen">
    <nav class="ios-nav" aria-label="Navegación">
      <a class="back-link" href="social.html#amigos">
        <svg class="back-link__icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Amigos</span>
      </a>
    </nav>

    <p class="ios-section__footer" id="usuario-cargando" role="status">Cargando…</p>
    <p class="alert alert--error" id="usuario-alerta" role="alert" hidden></p>

    <section class="ios-screen__panel" id="usuario" aria-labelledby="usuario-nombre" hidden>
      <header class="ios-contact">
        <span class="ios-contact__avatar" id="usuario-iniciales" aria-hidden="true"></span>
        <h1 class="ios-contact__name" id="usuario-nombre"></h1>
        <p class="ios-contact__subtitle" id="usuario-relacion"></p>
      </header>

      <div class="ios-list">
        <div class="ios-row">
          <span class="ios-row__label">Puntos totales</span>
          <span class="ios-row__body"></span>
          <span class="ios-row__value" id="usuario-puntos"></span>
        </div>
      </div>

      <div class="ios-section">
        <div class="ios-list">
          <button class="ios-row ios-row--action ios-row--start ios-row--destructive" id="boton-bloquear" type="button">Bloquear</button>
        </div>
        <p class="alert alert--error" id="bloquear-alerta" role="alert" hidden></p>
        <p class="ios-section__footer">Dejaréis de ser amigos y no podrá enviarte solicitudes ni ver dónde estudias. No se le avisará.</p>
      </div>
    </section>
  </main>
</body>
</html>
